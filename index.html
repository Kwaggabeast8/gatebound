<style>
/* Layout: a dungeon "system window" world. Landing scrolls; the app is a phone-width game shell with a sticky status bar, tabbed screens and a fixed bottom nav. */
:root{
  --void:#06070c; --panel:#0d1222; --panel-2:#131a31; --line:#232d4a;
  --ink:#e7ecf7; --dim:#8590b0;
  --sys:#5fe1d9; --sys-dim:rgba(95,225,217,.13);
  --gold:#f0c055; --blood:#ff5470; --frost:#8fb8ff;
  --r-e:#9aa3b8; --r-d:#6fd38a; --r-c:#5fe1d9; --r-b:#6f9bff; --r-a:#b77cff; --r-s:#f0c055;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(900px 420px at 50% -120px,rgba(95,225,217,.10),transparent 70%);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--void)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
.install{display:flex;gap:12px;align-items:flex-start;border:1px solid rgba(95,225,217,.45);background:var(--sys-dim);padding:12px 14px;font-size:14px}
.install b{font-family:var(--f-display);letter-spacing:.06em}
.install p{color:var(--dim);margin-top:2px}
.install button{background:none;border:0;color:var(--dim);font-size:20px;line-height:1;padding:2px 4px;margin-left:auto}
.install img{width:40px;height:40px;flex:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--sys);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--sys)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.01em}
p{margin:0}

.win{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);position:relative}
.win.sys{border-color:rgba(95,225,217,.55);box-shadow:0 0 36px rgba(95,225,217,.10) inset,0 0 24px rgba(95,225,217,.06)}
.win.sys::before,.win.sys::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--sys);pointer-events:none}
.win.sys::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win.sys::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win.red{border-color:rgba(255,84,112,.5);box-shadow:0 0 36px rgba(255,84,112,.10) inset}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border:1px solid var(--sys);background:var(--sys-dim);
  font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;transition:background .15s,transform .1s;text-decoration:none;color:var(--ink)}
.btn:hover{background:rgba(95,225,217,.28)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--sys);color:#04201f}
.btn.solid:hover{background:#86ece6}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--ink);border-color:var(--dim)}
.btn.gold{border-color:var(--gold);background:rgba(240,192,85,.14);color:var(--gold)}
.btn.sm{padding:7px 12px;font-size:11px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.sound{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;padding:6px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--dim)}
.sound.on{color:var(--sys);border-color:rgba(95,225,217,.5)}
.sound .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.sound .eq i{width:2px;background:currentColor;height:4px}
.sound.on .eq i{animation:eq 1.1s ease-in-out infinite}
.sound.on .eq i:nth-child(2){animation-delay:.25s}.sound.on .eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{50%{height:12px}}

/* ---------- LANDING ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;letter-spacing:.2em;color:var(--sys)}
.brand span{color:var(--ink)}
.brand svg{width:24px;height:24px}
.hero{padding-block:40px;display:grid;grid-template-columns:1.2fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(44px,8.5vw,92px);line-height:.92;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--sys);text-shadow:0 0 28px rgba(95,225,217,.45)}
.hero p{color:var(--dim);font-size:18px;max-width:46ch;margin:20px 0 28px}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.hero-card{padding:20px;display:grid;gap:12px}
.hero-card .q{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.hero-card .q span:last-child{color:var(--sys)}
.ticker{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding-block:12px;font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;color:var(--dim)}
.ticker span{display:inline-block;animation:tick 34s linear infinite}
.ticker b{color:var(--sys);font-weight:500;margin-inline:14px}
@keyframes tick{to{transform:translateX(-50%)}}
section.block{padding-block:60px 4px}
section.block h2{font-size:clamp(30px,5vw,46px);margin:8px 0 26px;text-transform:uppercase}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{padding:18px}
.card .n{font-family:var(--f-mono);color:var(--sys);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.card h3{font-size:19px;margin:6px 0}
.card p{color:var(--dim);font-size:15px}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.rung{border:1px solid var(--line);padding:14px 12px;background:var(--panel)}
.rung .L{font-family:var(--f-display);font-size:40px;line-height:1}
.rung .t{font-weight:600;margin-top:6px}
.rung .lv{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.tiers{display:flex;gap:10px;flex-wrap:wrap}
.tier{flex:1 1 140px;border:1px solid var(--line);border-top:3px solid var(--tc);padding:14px;background:var(--panel)}
.tier b{display:block;font-family:var(--f-display);color:var(--tc)}
.tier span{font-size:13px;color:var(--dim)}
.final{text-align:center;padding-block:72px 64px}
.final h2{font-size:clamp(40px,7vw,72px);text-transform:uppercase}
.final p{color:var(--dim);margin:10px auto 26px;max-width:42ch}
footer{border-top:1px solid var(--line);padding-block:20px;color:var(--dim);font-size:13px}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(3,4,9,.86);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(440px,100%);padding:28px 22px;text-align:center;animation:pop .35s ease-out}
.modal .tag{display:inline-block;border:1px solid var(--sys);padding:4px 12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--sys);margin-bottom:18px}
.modal.red .tag{border-color:var(--blood);color:var(--blood)}
.modal h2{font-size:26px;line-height:1.15}
.modal p{color:var(--dim);margin:12px 0 0}
.modal .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.modal input{width:100%;background:var(--void);border:1px solid var(--line);color:var(--ink);padding:12px 14px;font-family:var(--f-mono);font-size:16px;margin:18px 0 14px;text-align:center}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}

/* ---------- APP SHELL ---------- */
.shell{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.statusbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,7,12,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 0;margin-bottom:16px}
.sb-rank{width:34px;height:38px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:#0a0c14;background:var(--rc);
  clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);flex:none}
.sb-mid{flex:1;min-width:0}
.sb-name{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-xp{height:4px;background:var(--panel-2);margin-top:4px}
.sb-xp i{display:block;height:100%;background:var(--sys);transition:width .6s}
.sb-res{display:flex;gap:10px;align-items:center;font-family:var(--f-mono);font-size:13px;flex:none}
.sb-res .h{display:flex;gap:1px}
.sb-res svg{width:15px;height:15px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(9,11,20,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{background:none;border:0;padding:6px 2px;display:grid;justify-items:center;gap:3px;color:var(--dim);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;position:relative}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.tab.on{color:var(--sys)}
.tab.on::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:2px;background:var(--sys);box-shadow:0 0 10px var(--sys)}
.tab .badge{position:absolute;top:0;right:calc(50% - 20px);background:var(--gold);color:#1c1405;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.screen{display:grid;gap:14px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 18px 0;flex-wrap:wrap}
.ph h3{font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.pb{padding:12px 18px 18px}
.note{font-size:12px;color:var(--dim)}

/* quest */
.timer{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer .clock{font-family:var(--f-mono);font-size:28px;font-weight:700;letter-spacing:.06em}
.qhead{text-align:center;padding:20px 18px 4px}
.qhead .tag{display:inline-block;border:1px solid var(--sys);padding:3px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--sys)}
.qhead h2{font-size:22px;margin-top:10px;text-transform:uppercase}
.ex{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding-block:12px;border-bottom:1px dashed var(--line);align-items:center}
.ex:last-of-type{border-bottom:0}
.ex .nm{font-weight:600;font-size:17px}
.ex .ct{font-family:var(--f-mono);font-size:15px;color:var(--dim)}
.ex .ct b{color:var(--ink)}
.ex.done .ct b{color:var(--sys)}
.ex.done .nm::after{content:" ✓";color:var(--sys)}
.ex .bar{grid-column:1/-1;height:5px;background:var(--void);overflow:hidden}
.ex .bar i{display:block;height:100%;background:var(--sys);transition:width .25s}
.ex .ctl{display:flex;gap:6px}
.ex .ctl button{min-width:46px;height:44px;border:1px solid var(--line);background:var(--void);font-family:var(--f-mono);font-size:13px}
.ex .ctl button:hover{border-color:var(--sys)}
.ex .ctl .all{color:var(--sys)}
.penalty{margin-top:12px;padding:10px 12px;border:1px solid rgba(255,84,112,.35);background:rgba(255,84,112,.06);font-size:13px;color:#ffb3c0}
.claim{margin-top:14px;width:100%}
.cleared{margin-top:14px;padding:14px;border:1px solid var(--sys);background:var(--sys-dim);text-align:center;font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.reward{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:10px;font-family:var(--f-mono);font-size:13px;color:var(--dim)}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.day{aspect-ratio:1;max-width:100%;min-width:0;padding:0;border:1px solid var(--line);background:var(--void)}
.day.s-cleared{background:var(--sys);border-color:var(--sys)}
.day.s-missed{background:var(--blood);border-color:var(--blood)}
.day.s-frozen{background:var(--frost);border-color:var(--frost)}
.day.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dim)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* hunter */
.status{padding:20px 18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.rankbadge{width:78px;height:90px;display:grid;place-items:center;font-family:var(--f-display);font-size:50px;font-weight:700;
  clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);background:var(--rc);color:#0a0c14}
.status h2{font-size:24px}
.status .title{color:var(--rc);font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.xpbar{height:8px;background:var(--void);border:1px solid var(--line);margin:10px 0 4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sys),#a8f5f0)}
.xpmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.attrs{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.attr{border:1px solid var(--line);background:var(--void);padding:8px 10px}
.attr .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--dim)}
.attr .v{font-family:var(--f-mono);font-size:20px;font-weight:700}
.attr .v small{font-size:12px;color:var(--sys);font-weight:500}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);background:var(--void);padding:10px;min-height:96px;display:grid;align-content:space-between;gap:6px;text-align:left;border-top:3px solid var(--rar,var(--line))}
.slot .sl{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.slot .sn{font-weight:600;font-size:13px;line-height:1.2}
.slot .ss{font-family:var(--f-mono);font-size:11px;color:var(--rar)}
.slot.empty .sn{color:var(--dim);font-weight:400}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:4px;background:var(--line)}
.pips i.f{background:var(--sys)}
.pips.warn i.f{background:var(--blood)}

/* loot */
.chests{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cslot{border:1px solid var(--line);background:var(--void);padding:12px 6px 10px;display:grid;justify-items:center;gap:6px;text-align:center}
.cslot .mini{width:44px;height:34px;position:relative}
.cslot .mini::before{content:"";position:absolute;inset:12px 0 0;border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 18%,var(--void))}
.cslot .mini::after{content:"";position:absolute;inset:0 0 auto;height:14px;border:2px solid var(--tc);border-bottom:0;background:color-mix(in srgb,var(--tc) 28%,var(--void))}
.cslot .cn{font-size:12px;font-weight:600;line-height:1.15}
.cslot .cc{font-family:var(--f-mono);font-size:12px;color:var(--tc)}
.cslot.none{opacity:.45}
.bagtools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:none;padding:5px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.chip.on{border-color:var(--sys);color:var(--sys);background:var(--sys-dim)}
.bag{display:grid;gap:6px}
.gear{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--rar);padding:10px 12px;background:var(--void)}
.gear .g{font-weight:600;font-size:15px;line-height:1.2}
.gear .m{font-family:var(--f-mono);font-size:11px;color:var(--rar);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.gear .acts{display:flex;gap:6px}
.gear.eqd{background:var(--sys-dim)}
.empty{color:var(--dim);font-size:14px;border:1px dashed var(--line);padding:16px;text-align:center}

/* board */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-bottom:12px}
.seg button{background:none;border:0;padding:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.seg button.on{background:var(--sys-dim);color:var(--sys)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:6px;align-items:end;margin-bottom:10px}
.pod{text-align:center;border:1px solid var(--line);background:var(--void);padding:10px 4px}
.pod .p{font-family:var(--f-display);font-size:24px}
.pod .pn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .px{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.pod.first{border-color:var(--gold);background:rgba(240,192,85,.08)}
.board{display:grid;gap:4px}
.brow{display:grid;grid-template-columns:34px 1fr auto 64px;gap:10px;align-items:center;padding:8px 10px;background:var(--void);border:1px solid transparent}
.brow.me{border-color:var(--sys);background:var(--sys-dim)}
.brow .pos{font-family:var(--f-mono);color:var(--dim)}
.brow .rk{font-family:var(--f-display);font-weight:700;width:22px;text-align:center}
.brow .x{font-family:var(--f-mono);text-align:right}
.brow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gap{text-align:center;color:var(--dim);font-family:var(--f-mono);letter-spacing:.3em}
.climb{display:grid;gap:6px}
.climb .r{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.climb .r b{font-family:var(--f-display);font-size:20px}
.climb .r.cur{color:var(--ink)}
.climb .r.lock{opacity:.4}

/* shop */
.shop{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);padding:12px;background:var(--void)}
.item .d{font-size:13px;color:var(--dim)}
.log{font-family:var(--f-mono);font-size:12px;color:var(--dim);display:grid;gap:4px;max-height:180px;overflow:auto}
.log div::before{content:"> ";color:var(--sys)}

/* chest modal */
.chest{width:130px;height:104px;margin:40px auto 16px;position:relative}
.chest .lid,.chest .box{position:absolute;left:0;right:0;border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 22%,#120d06)}
.chest .box{bottom:0;height:58%}
.chest .lid{top:4px;height:40%;transform-origin:bottom left;transition:transform .5s ease}
.chest .lock{position:absolute;left:50%;top:38%;width:16px;height:18px;margin-left:-8px;background:var(--tc);z-index:2;transition:opacity .2s}
.chest.shake{animation:shake .45s infinite}
.chest.open .lid{transform:rotate(-18deg) translateY(-10px)}
.chest.open .lock{opacity:0}
.chest .glow{position:absolute;inset:-46px;background:radial-gradient(circle,var(--glow),transparent 62%);opacity:0;transition:opacity .5s}
.chest.open .glow{opacity:1}
.chest .rays{position:absolute;inset:-60px;background:repeating-conic-gradient(var(--glow) 0 6deg,transparent 6deg 24deg);mask:radial-gradient(circle,#000 20%,transparent 65%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);opacity:0;transition:opacity .6s}
.chest.open.big .rays{opacity:.7;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.loot-name{font-family:var(--f-display);font-size:24px;color:var(--rar)}
.cmp{font-family:var(--f-mono);font-size:12px;margin-top:6px}

.dead{text-align:center;padding:30px 20px}
.dead h2{font-size:clamp(34px,8vw,52px);color:var(--blood);text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--sys);padding:10px 16px;font-family:var(--f-mono);font-size:13px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.hurt-flash{position:fixed;inset:0;pointer-events:none;z-index:70;box-shadow:inset 0 0 120px rgba(255,84,112,.7);animation:flash .9s ease-out forwards}
@keyframes flash{to{opacity:0}}


/* ---------- START SCREEN (phone app) ---------- */
.splash{max-width:480px;margin:0 auto;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:14px 22px}
.splash-top{display:flex;justify-content:space-between;align-items:center}
.splash-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding-block:24px}
.sigil{width:116px;height:116px;display:grid;place-items:center;color:var(--sys);border:1px solid rgba(95,225,217,.5);position:relative;margin-bottom:12px;
  box-shadow:0 0 50px rgba(95,225,217,.25),0 0 30px rgba(95,225,217,.15) inset;animation:breathe 4s ease-in-out infinite}
.sigil::before{content:"";position:absolute;inset:-10px;border:1px solid rgba(95,225,217,.18);transform:rotate(45deg)}
.sigil svg{width:62px;height:62px;filter:drop-shadow(0 0 10px rgba(95,225,217,.7))}
@keyframes breathe{50%{box-shadow:0 0 80px rgba(95,225,217,.4),0 0 40px rgba(95,225,217,.22) inset}}
.splash-title{font-size:clamp(40px,12vw,56px);letter-spacing:.14em;line-height:1;text-shadow:0 0 30px rgba(95,225,217,.35)}
.splash-sub{font-family:var(--f-mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--sys)}
.rankrow{display:flex;gap:6px;margin-top:18px}
.rankrow span{width:34px;height:38px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#0a0c14;background:var(--c);
  clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);opacity:.9}
.splash-line{color:var(--dim);margin-top:14px;font-size:15px}
.splash-bot{display:grid;gap:10px}
.btn.big{width:100%;padding:16px 20px;font-size:15px}
.guide{text-align:left;display:grid;gap:12px;margin-top:6px}
.guide div{border-left:2px solid var(--sys);padding-left:12px}
.guide b{font-family:var(--f-display);display:block}
.guide span{color:var(--dim);font-size:14px}
body{-webkit-user-select:none;user-select:none}
html,body{overflow-x:hidden;max-width:100%}
.screen>*,.pb>*,.ex>*{min-width:0}
.screen{grid-template-columns:minmax(0,1fr)}
.statusbar .sound{padding:8px 10px}.statusbar .sound .lbl{display:none}
.toast{top:calc(16px + env(safe-area-inset-top,0px));bottom:auto}
input{-webkit-user-select:text;user-select:text}

/* ================= RPG LAYER ================= */
:root{--trim:#c9a24a;--trim-hi:#f3d68a;--ember:#ff8a3d;--arcane:#8b6cff;--f-fantasy:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif}
body{background:
  radial-gradient(120% 55% at 50% -10%,rgba(95,225,217,.14),transparent 62%),
  radial-gradient(100% 50% at 50% 112%,rgba(139,108,255,.20),transparent 62%),
  radial-gradient(60% 40% at 0% 85%,rgba(255,138,61,.08),transparent 70%),var(--void);background-attachment:fixed}

.tabs{background:linear-gradient(180deg,rgba(16,19,36,.97),rgba(5,6,12,.99));border-top:1px solid rgba(201,162,74,.45);box-shadow:0 -10px 30px rgba(0,0,0,.6)}

.qhead .tag{border:0;background:linear-gradient(90deg,transparent,rgba(95,225,217,.28),transparent);padding:5px 30px;color:#c8fbf7;text-shadow:0 0 10px var(--sys)}

.ex .nm{font-family:var(--f-fantasy);font-weight:700;letter-spacing:.03em}

.ex .bar{height:7px;background:#04050a;border:1px solid rgba(201,162,74,.22)}

.penalty{border-color:rgba(255,84,112,.35);background:linear-gradient(90deg,rgba(255,84,112,.10),transparent)}

.slot{background:linear-gradient(180deg,color-mix(in srgb,var(--rar,#232d4a) 16%,#0a0d1a),#05060c);border-color:rgba(201,162,74,.22)}

.item{background:linear-gradient(180deg,#0c1020,#05060c);border-color:rgba(201,162,74,.22)}

.pod.first{box-shadow:0 0 22px rgba(243,214,138,.25),inset 0 0 20px rgba(243,214,138,.12)}

.seg{border-color:rgba(201,162,74,.3)}
.chip{border-color:rgba(201,162,74,.25)}

.overlay{background:radial-gradient(circle at 50% 45%,rgba(20,12,40,.82),rgba(2,2,6,.94));overflow-x:hidden}
.modal .tag{border-color:var(--trim);color:var(--trim-hi);background:rgba(201,162,74,.10);text-shadow:0 0 8px rgba(243,214,138,.5)}

.install{border-color:rgba(201,162,74,.4);background:linear-gradient(90deg,rgba(201,162,74,.12),transparent)}

/* hunter figure */
.figure{display:grid;place-items:center;margin:-4px 0 12px}
.hunter{width:min(210px,62vw);height:auto;overflow:visible}
.hunter .hbase{fill:none;stroke:var(--sys);stroke-width:1.5;opacity:.6;filter:drop-shadow(0 0 6px var(--sys))}
.hunter .hbase2{fill:rgba(95,225,217,.08);stroke:rgba(201,162,74,.5);stroke-dasharray:3 5;animation:dash 6s linear infinite}

.hunter .limb{fill:none;stroke:#1d2440;stroke-width:9;stroke-linecap:round}

@keyframes blink{0%,94%,100%{opacity:1}96%{opacity:.1}}
.hunter .hs *{fill:#141a30;stroke:#2c3658;stroke-width:2;stroke-linejoin:round}

.hunter .hs.on{filter:drop-shadow(0 0 7px var(--sc))}
.hunter .wp *{fill:none;stroke-width:5;stroke-linecap:round}

/* splash portal */
.portal{width:min(76vw,290px);aspect-ratio:1;max-width:100%;position:relative}
.portal svg{width:100%;height:100%;overflow:visible}
.ring{transform-box:view-box;transform-origin:100px 100px;animation:spin 80s linear infinite}

@keyframes corepulse{50%{transform:scale(1.07)}}
.splash-title{font-weight:900;font-size:clamp(34px,11vw,52px);letter-spacing:.12em;filter:drop-shadow(0 2px 0 #2a1806) drop-shadow(0 0 18px rgba(243,214,138,.35))}

.rankrow span{background:linear-gradient(155deg,#fff 0%,var(--c) 34%,color-mix(in srgb,var(--c) 50%,#000) 100%);font-family:var(--f-fantasy);font-weight:900}
.splash-line{font-family:var(--f-fantasy);color:#b9b3a0;letter-spacing:.04em}

/* fx */
.ftxt{position:fixed;z-index:97;pointer-events:none;font-family:var(--f-mono);font-weight:700;font-size:20px;transform:translate(-50%,-50%);text-shadow:0 0 10px currentColor,0 2px 0 #000;animation:ftup .95s ease-out forwards;white-space:nowrap}
@keyframes ftup{from{opacity:1;transform:translate(-50%,-50%) scale(.8)}25%{transform:translate(-50%,-90%) scale(1.15)}to{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.shk{animation:shk .45s}
@keyframes shk{20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(2px,-1px)}}
.lvup{position:fixed;inset:0;z-index:97;display:grid;place-items:center;pointer-events:none;overflow:hidden;animation:lvfade 2.4s ease forwards}
.lvup .in{text-align:center;position:relative}
.lvup .rays{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(243,214,138,.24) 0 5deg,transparent 5deg 20deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%);animation:spin 8s linear infinite}
.lv-t{position:relative;font-family:var(--f-fantasy);font-weight:900;font-size:clamp(40px,13vw,66px);letter-spacing:.08em;filter:drop-shadow(0 0 22px rgba(243,214,138,.65));animation:lvpop .6s cubic-bezier(.2,1.6,.4,1) both}

@keyframes lvfade{0%,75%{opacity:1}100%{opacity:0}}

.status .attrs,.status>.note{justify-self:stretch;width:100%}
.toast{top:calc(74px + env(safe-area-inset-top,0px))}
.bgrune{opacity:.05}.bgrune .core{display:none}

/* ================= BOSS ARENA ================= */
.arena{position:relative;padding-bottom:6px;background:radial-gradient(70% 60% at 50% 62%,color-mix(in srgb,var(--bc) 22%,transparent),transparent 70%)}
.arena .qhead h2{font-size:30px}
.boss{position:relative;display:grid;place-items:center;height:178px;margin-top:-4px}
.beast{width:min(250px,72vw);height:auto;overflow:visible}
.beast .shadow{fill:rgba(0,0,0,.6)}
.beast .bob{transform-box:fill-box;transform-origin:50% 100%;animation:bossidle 3.2s ease-in-out infinite}
@keyframes bossidle{50%{transform:translateY(-5px) scaleY(1.025)}}
.beast .body{fill:color-mix(in srgb,var(--bc) 16%,#05060c);stroke:var(--bc);stroke-width:2.2;stroke-linejoin:round;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--bc) 55%,transparent))}
.beast .horn{fill:color-mix(in srgb,var(--bc) 30%,#0b0d1a);stroke:var(--bc);stroke-width:2;stroke-linejoin:round}
.beast .eye{fill:#fff;stroke:var(--bc);stroke-width:3;paint-order:stroke;filter:drop-shadow(0 0 6px var(--bc)) drop-shadow(0 0 14px var(--bc));animation:glare 4s ease-in-out infinite}
@keyframes glare{50%{opacity:.75}}
.beast .maw{fill:#010205;stroke:var(--bc);stroke-width:1.6;stroke-linejoin:round}
.beast .claw{fill:none;stroke:var(--bc);stroke-width:3;stroke-linecap:round}
.beast .rune{fill:none;stroke:var(--bc);stroke-width:1.4;opacity:.7}
.boss.hit .beast{animation:bosshit .38s ease-out}
@keyframes bosshit{0%{filter:brightness(4) saturate(0)}25%{transform:translateX(-10px) rotate(-2deg)}55%{transform:translateX(7px) rotate(1deg)}100%{filter:none;transform:none}}
.arena.dead .beast{filter:grayscale(1) brightness(.4);opacity:.75;transition:filter .8s,opacity .8s}
.arena.dead .bob,.arena.dead .eye{animation:none}
.slain{position:absolute;font-family:var(--f-fantasy);font-weight:900;font-size:38px;letter-spacing:.1em;color:#ff5470;border:3px solid #ff5470;padding:0 18px;transform:rotate(-12deg);
  text-shadow:0 0 18px rgba(255,84,112,.8);box-shadow:0 0 22px rgba(255,84,112,.4),inset 0 0 18px rgba(255,84,112,.3);background:rgba(10,0,4,.35);animation:stamp .45s cubic-bezier(.2,1.8,.4,1) both}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.6);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.hp{padding:4px 18px 0;display:grid;gap:4px}
.hpbar{position:relative;height:16px;background:#04050a;border:1px solid rgba(201,162,74,.5);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.hpbar b,.hpbar i{position:absolute;left:0;top:0;bottom:0;display:block}
.hpbar b{background:#fff3f5;opacity:.75;transition:width .9s ease .35s}
.hpbar i{background:linear-gradient(180deg,#ff8fa3,#ff3d5e 50%,#9c1430);box-shadow:0 0 12px rgba(255,84,112,.8);transition:width .35s cubic-bezier(.2,.9,.3,1)}
.hpnum{text-align:center;font-size:12px;color:#ffb3c0;letter-spacing:.12em}
.ftxt.big{font-size:32px;font-family:var(--f-fantasy);font-weight:900}
.white-flash{position:fixed;inset:0;pointer-events:none;z-index:95;background:#fff;animation:wflash .5s ease-out forwards}
@keyframes wflash{from{opacity:.75}to{opacity:0}}
.screen.enter>*{animation:scrin .42s cubic-bezier(.2,.8,.2,1) both}
.screen.enter>*:nth-child(2){animation-delay:.05s}.screen.enter>*:nth-child(3){animation-delay:.1s}.screen.enter>*:nth-child(4){animation-delay:.15s}
@keyframes scrin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.gear[data-r="legendary"],.gear[data-r="epic"],.slot[data-r="legendary"],.slot[data-r="epic"]{position:relative;overflow:hidden}
.gear[data-r="legendary"]::after,.gear[data-r="epic"]::after,.slot[data-r="legendary"]::after,.slot[data-r="epic"]::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 35%,color-mix(in srgb,var(--rar) 40%,transparent) 50%,transparent 65%) no-repeat;background-size:260% 100%;animation:gshine 3.2s linear infinite}
.gear[data-r="legendary"],.slot[data-r="legendary"]{box-shadow:0 0 16px color-mix(in srgb,var(--rar) 45%,transparent)}
@keyframes gshine{from{background-position:160% 0}to{background-position:-160% 0}}

/* ================= ALTAR OF FATE ================= */
.altar{border-color:rgba(139,108,255,.55)!important;background:radial-gradient(90% 70% at 50% 0,rgba(139,108,255,.22),transparent 70%),linear-gradient(180deg,rgba(22,18,48,.95),rgba(8,8,20,.96))!important;overflow:hidden}

.odds .bad{color:#ff9aab;border-color:rgba(255,84,112,.4);background:rgba(255,84,112,.06)}

.fcard:not(.flip):not(:disabled):hover,.fcard:not(.flip):not(:disabled):focus-visible{transform:translateY(-8px)}

<script>
/* ================= SOUND: original generative dark ambient + SFX ================= */
const SND={
  ctx:null,on:false,timers:[],
  pref(){try{return localStorage.getItem('gatebound.sound')!=='off'}catch(e){return true}},
  setPref(v){try{localStorage.setItem('gatebound.sound',v?'on':'off')}catch(e){}},
  init(){
    if(this.ctx)return true;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
    const c=this.ctx=new C();
    this.master=c.createGain();this.master.gain.value=.85;this.master.connect(c.destination);
    this.mus=c.createGain();this.mus.gain.value=0;this.mus.connect(this.master);
    this.fx=c.createGain();this.fx.gain.value=.55;this.fx.connect(this.master);
    const len=c.sampleRate*4.5,ir=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    this.rev=c.createConvolver();this.rev.buffer=ir;const rg=c.createGain();rg.gain.value=.55;this.rev.connect(rg);rg.connect(this.mus);
    this.dry=c.createGain();this.dry.gain.value=.6;this.dry.connect(this.mus);
    this.dl=c.createDelay(1.5);this.dl.delayTime.value=.48;const fb=c.createGain();fb.gain.value=.42;this.dl.connect(fb);fb.connect(this.dl);this.dl.connect(this.rev);this.dl.connect(this.dry);
    // drone: detuned low saws through a slowly breathing filter
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;lp.Q.value=7;
    const lfo=c.createOscillator();lfo.frequency.value=.045;const lg=c.createGain();lg.gain.value=95;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
    [[36.71,.10],[36.95,.09],[55,.06],[73.42,.03]].forEach(([f,g])=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;const gg=c.createGain();gg.gain.value=g;o.connect(gg);gg.connect(lp);o.start()});
    lp.connect(this.dry);lp.connect(this.rev);
    // noise wind
    const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    this.noiseBuf=nb;
    const ns=c.createBufferSource();ns.buffer=nb;ns.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.8;
    const wl=c.createOscillator();wl.frequency.value=.07;const wg=c.createGain();wg.gain.value=260;wl.connect(wg);wg.connect(bp.frequency);wl.start();
    const ng=c.createGain();ng.gain.value=.022;ns.connect(bp);bp.connect(ng);ng.connect(this.rev);ns.start();
    return true;
  },
  start(){
    if(!this.init())return;this.ctx.resume();if(this.on)return;this.on=true;
    const t=this.ctx.currentTime;this.mus.gain.cancelScheduledValues(t);this.mus.gain.setValueAtTime(this.mus.gain.value,t);this.mus.gain.linearRampToValueAtTime(.6,t+4);
    const chords=[[146.83,174.61,220],[116.54,146.83,174.61],[155.56,196,233.08],[110,138.59,164.81]];let ci=0;
    const pad=()=>{this.pad(chords[ci++%4])};pad();this.timers.push(setInterval(pad,8000));
    const beat=()=>{this.thump(0);this.thump(.3)};this.timers.push(setInterval(beat,2400));
    const bellLoop=()=>{this.bell();this.timers.push(setTimeout(bellLoop,1600+Math.random()*3400))};this.timers.push(setTimeout(bellLoop,2500));
    const deep=()=>{this.gong()};this.timers.push(setInterval(deep,32000));setTimeout(deep,1200);
  },
  stop(){
    if(!this.ctx)return;this.on=false;this.timers.forEach(x=>{clearInterval(x);clearTimeout(x)});this.timers=[];
    const t=this.ctx.currentTime;this.mus.gain.cancelScheduledValues(t);this.mus.gain.setValueAtTime(this.mus.gain.value,t);this.mus.gain.linearRampToValueAtTime(0,t+1.2);
  },
  pad(fs){const c=this.ctx,t=c.currentTime;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=900;f.connect(this.dry);f.connect(this.rev);
    fs.forEach(fr=>[0,6].forEach(dt=>{const o=c.createOscillator();o.type='triangle';o.frequency.value=fr;o.detune.value=dt;const g=c.createGain();
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.028,t+2.6);g.gain.setValueAtTime(.028,t+5.6);g.gain.linearRampToValueAtTime(0,t+8.4);o.connect(g);g.connect(f);o.start(t);o.stop(t+8.6)}))},
  bell(){const c=this.ctx,t=c.currentTime,sc=[587.33,622.25,698.46,783.99,880,932.33,1046.5,293.66,349.23];const fr=sc[Math.floor(Math.random()*sc.length)];
    [[1,.045],[2.76,.012],[5.4,.005]].forEach(([m,a])=>{const o=c.createOscillator();o.type='sine';o.frequency.value=fr*m;const g=c.createGain();
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(g);g.connect(this.dl);g.connect(this.rev);o.start(t);o.stop(t+3.3)})},
  thump(d){const c=this.ctx,t=c.currentTime+d;const o=c.createOscillator();o.frequency.setValueAtTime(72,t);o.frequency.exponentialRampToValueAtTime(38,t+.18);
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(d?.13:.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(this.mus);o.start(t);o.stop(t+.35)},
  gong(){const c=this.ctx,t=c.currentTime;[[73.42,.12],[110.5,.05],[146,.03],[197,.02]].forEach(([f,a])=>{const o=c.createOscillator();o.frequency.value=f;const g=c.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+9);o.connect(g);g.connect(this.rev);g.connect(this.dry);o.start(t);o.stop(t+9.2)})},
  tone(f,d,type='square',a=.08,when=0,slide){if(!this.ctx||!this.pref())return;const c=this.ctx,t=c.currentTime+when;const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);const g=c.createGain();g.gain.setValueAtTime(a,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.fx);o.start(t);o.stop(t+d+.05)},
  noise(d,ftype,f,a,when=0,sweep){if(!this.ctx||!this.pref())return;const c=this.ctx,t=c.currentTime+when;const s=c.createBufferSource();s.buffer=this.noiseBuf;const fl=c.createBiquadFilter();fl.type=ftype;fl.frequency.setValueAtTime(f,t);
    if(sweep)fl.frequency.exponentialRampToValueAtTime(sweep,t+d);const g=c.createGain();g.gain.setValueAtTime(a,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(this.fx);s.start(t);s.stop(t+d+.05)},
  sfx(k,x){
    buzz({tick:8,tab:6,done:[15,40,15],notice:[20,60,20],claim:[30,60,30,60,90],shake:12,open:x==='legendary'||x==='epic'?[60,40,60,40,200]:[40,30,100],
      equip:20,coin:12,altar:[30,80,30],flip:15,bless:[40,40,40,40,120],curse:[180,60,260],hit:30,crit:[40,30,90],slay:[80,40,80,40,300],hurt:[220,80,220],shatter:[50,30,50,30,50],level:[30,40,30,40,60],fall:[400,120,600]}[k]);
    switch(k){
      case 'tick':this.tone(740,.06,'square',.04);break;
      case 'done':this.tone(587,.08,'square',.05);this.tone(880,.12,'square',.05,.07);break;
      case 'tab':this.tone(420,.05,'triangle',.06);break;
      case 'notice':this.tone(293.66,.5,'triangle',.08);this.tone(440,.6,'triangle',.06,.12);this.tone(587.33,.9,'sine',.07,.24);break;
      case 'claim':[587.33,698.46,880,1174.66].forEach((f,i)=>this.tone(f,.35,'triangle',.08,i*.09));this.tone(1760,.8,'sine',.03,.36);break;
      case 'shake':this.noise(.12,'bandpass',300,.12);this.tone(90,.12,'sine',.12);break;
      case 'open':this.noise(.6,'highpass',800,.1,0,6000);const sc={common:[523,659],rare:[523,659,784],epic:[523,659,784,1047],legendary:[523,659,784,1047,1319,1568]}[x]||[523];
        sc.forEach((f,i)=>this.tone(f,.9,'sine',.07,.1+i*.09));if(x==='legendary'||x==='epic')this.tone(65.4,2,'sine',.18,.05);break;
      case 'equip':this.tone(220,.08,'square',.06);this.noise(.08,'highpass',3000,.05,.02);this.tone(330,.1,'square',.05,.06);break;
      case 'coin':this.tone(988,.08,'square',.05);this.tone(1319,.2,'square',.05,.07);break;
      case 'hurt':this.tone(140,.5,'sawtooth',.14,0,40);this.noise(.3,'lowpass',600,.18);break;
      case 'shatter':this.noise(.5,'highpass',2500,.2,0,8000);[1800,2400,3100].forEach((f,i)=>this.tone(f,.25,'triangle',.04,i*.04));break;
      case 'level':[293.66,440,587.33,880].forEach((f,i)=>this.tone(f,.6,'sawtooth',.04,i*.12));break;

      case 'crit':this.noise(.22,'lowpass',1400,.32);this.tone(200,.25,'sawtooth',.13,0,50);this.tone(1320,.18,'square',.05,.04);this.tone(1760,.25,'square',.04,.1);break;
      case 'slay':this.tone(240,1.3,'sawtooth',.13,0,35);this.noise(1.1,'lowpass',500,.26,0,70);[293.66,349.23,440,587.33].forEach((f,i)=>this.tone(f,.7,'triangle',.07,.5+i*.11));break;

      case 'bless':[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>this.tone(f,1.1,'triangle',.07,i*.08));this.tone(130.8,1.8,'sine',.16);break;
      case 'curse':this.tone(98,1.4,'sawtooth',.12,0,49);this.tone(103.8,1.4,'sawtooth',.1,0,52);this.tone(622,.9,'square',.03,.1,311);this.noise(.8,'lowpass',500,.2);break;
      case 'fall':this.tone(110,2.5,'sawtooth',.12,0,30);this.tone(116.5,2.5,'sawtooth',.1,0,32);break;
    }
  }
};

/* ================= FX: embers, bursts, floating numbers ================= */
const FX=(()=>{
  const RM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
  const bg=document.getElementById('embers'),top=document.getElementById('fx');
  const bx=bg.getContext('2d'),tx=top.getContext('2d');let W=0,H=0;
  function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;[bg,top].forEach(c=>{c.width=W*d;c.height=H*d});bx.setTransform(d,0,0,d,0,0);tx.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);
  const COLS=['95,225,217','255,138,61','139,108,255','243,214,138'];
  const spawn=(e,init)=>{e.x=Math.random()*W;e.y=init?Math.random()*H:H+10;e.r=.6+Math.random()*1.7;e.vy=-(.18+Math.random()*.5);e.vx=(Math.random()-.5)*.2;
    const q=Math.random();e.c=COLS[q<.45?0:q<.75?1:q<.9?2:3];e.ph=Math.random()*6.3;return e};
  const em=[];for(let i=0;i<(RM?0:40);i++)em.push(spawn({},true));
  const parts=[];let raf=0;
  function frame(){
    bx.clearRect(0,0,W,H);bx.globalCompositeOperation='lighter';
    for(const e of em){e.y+=e.vy;e.ph+=.02;e.x+=e.vx+Math.sin(e.ph)*.18;if(e.y<-10)spawn(e);
      const a=Math.max(0,Math.min(1,(H-e.y)/H*1.3))*.75;
      bx.fillStyle=`rgba(${e.c},${a*.12})`;bx.beginPath();bx.arc(e.x,e.y,e.r*4.5,0,7);bx.fill();
      bx.fillStyle=`rgba(${e.c},${a})`;bx.beginPath();bx.arc(e.x,e.y,e.r,0,7);bx.fill()}
    tx.clearRect(0,0,W,H);
    if(parts.length){tx.globalCompositeOperation='lighter';
      for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life--;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.982;p.vy*=.982;
        if(p.life<=0){parts.splice(i,1);continue}const a=p.life/p.max;
        tx.fillStyle=`rgba(${p.c},${a*.22})`;tx.beginPath();tx.arc(p.x,p.y,p.r*3.2,0,7);tx.fill();
        tx.fillStyle=`rgba(${p.c},${a})`;tx.beginPath();tx.arc(p.x,p.y,p.r,0,7);tx.fill()}}
    raf=requestAnimationFrame(frame)}
  raf=requestAnimationFrame(frame);
  document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden)raf=requestAnimationFrame(frame)});
  const rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return`${n>>16&255},${n>>8&255},${n&255}`};
  return{
    burst(x,y,color='#5fe1d9',n=30,spd=4,g=.06){if(RM)return;const c=rgb(color);for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.25+Math.random()),l=40+Math.random()*45;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,g,r:1+Math.random()*2.3,c,life:l,max:l})}},
    at(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]},
    float(x,y,text,color,cls){const s=document.createElement('div');s.className='ftxt '+(cls||'');s.textContent=text;s.style.left=x+'px';s.style.top=y+'px';s.style.color=color;document.body.appendChild(s);setTimeout(()=>s.remove(),1000)},

    levelUp(lv){const d=document.createElement('div');d.className='lvup';d.innerHTML=`<div class="in"><div class="rays"></div><div class="lv-t">LEVEL UP</div><div class="lv-n">LV ${lv}</div></div>`;
      document.body.appendChild(d);this.burst(innerWidth/2,innerHeight/2,'#f3d68a',80,7,.05);this.burst(innerWidth/2,innerHeight/2,'#5fe1d9',40,5,.05);setTimeout(()=>d.remove(),2500)}
  };

/* armor cracks on every lost heart */
function crackArmor(rep){SLOTS.filter(s=>s.arm).forEach(s=>{const it=item(S.eq[s.id]);if(!it)return;it.dur--;
  if(it.dur<=0){S.bag=S.bag.filter(x=>x.id!==it.id);delete S.eq[s.id];rep.shattered.push(it.nm);log(`${it.nm} shattered.`)}else rep.cracked++})}

function evaluate(){
  const rep={missed:0,frozen:0,shattered:[],cracked:0,fell:false};
  if(S.dead)return rep;
  const y=addDays(today(),-1);let d=addDays(S.lastEval,1);
  while(d<=y){
    if(!S.days[d]){
      if(S.freezes>0){S.freezes--;S.days[d]='frozen';rep.frozen++;log('A streak freeze covered a missed day.')}
      else{S.hearts--;S.streak=0;S.days[d]='missed';rep.missed++;log('Gate left open. −1 heart.');crackArmor(rep);
        if(S.hearts<=0){S.hearts=0;S.dead=true;rep.fell=true;log('Your hunter has fallen.');break}}
    }
    d=addDays(d,1);
  }
  S.lastEval=y;
  if(S.prog.date!==today())S.prog={date:today(),c:{}};
  save();return rep;
}

   ${rep.frozen?`<p style="color:var(--frost)">${rep.frozen} streak freeze${rep.frozen>1?'s':''} used.</p>`:''}

   <div class="row"><button class="btn solid" id="ok">Get to work</button></div>`,rep.missed?'red':'');
  $('#ok').onclick=closeModal;
}

function rollRarity(m){const r=rankIdx(S.level)*.5+m;const w={common:Math.max(10,62-14*r),rare:28+5*r,epic:8+5*r,legendary:2+3*r};
  let tot=Object.values(w).reduce((a,b)=>a+b),x=Math.random()*tot;for(const q in w){if((x-=w[q])<0)return q}return'common'}
function chestTierFor(streak){return streak>=14?'obsidian':streak>=7?'gold':streak>=3?'iron':'wood'}

function claim(){
  const t=today();if(S.days[t])return;
  const cb=$('#claim'),[cx,cy]=cb?FX.at(cb):[innerWidth/2,innerHeight/2];
  const r=rankIdx(S.level);let xp=100+20*r+Math.min(S.streak,10)*5;const gold=20+5*r,blessed=S.titan>0;if(blessed){xp*=2;S.titan--}if(S.heavy>0)S.heavy--;
  S.days[t]='cleared';S.streak++;S.best=Math.max(S.best,S.streak);S.xp+=xp;S.totalXp+=xp;S.gold+=gold;
  let lv=0;while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;lv++}
  const heal=S.streak%7===0&&S.hearts<3;if(heal)S.hearts++;
  const tier=chestTierFor(S.streak);S.chests[tier]++;
  const nr=rankIdx(S.level);let bonus=null;if(nr>r){S.chests.gold++;bonus=RANKS[nr]}
  log(`Gate cleared. +${xp} XP, +${gold} G, ${CHESTS[tier].nm} chest.`);if(lv)log(`Level up → ${S.level}.`);if(bonus)log(`Rank up → ${bonus.L}-Rank ${bonus.t}. Bonus gilded chest.`);
  save();render();SND.sfx('claim');FX.burst(cx,cy,'#f3d68a',70,6.5,.16);FX.burst(cx,cy,'#5fe1d9',30,4.5,.08);if(lv)setTimeout(()=>{SND.sfx('level');FX.levelUp(S.level)},450);

}

function renderQuest(sc,r,R){

        <div class="bar"><i style="width:${Math.min(100,v/x.t*100)}%"></i></div></div>`}).join('')}
      ${done?`<div class="cleared">Gate cleared · come back tomorrow</div>`:`
        <div class="reward"><span style="color:var(--gold)">+${xpR} XP</span><span style="color:var(--gold)">+${20+5*r} G</span><span style="color:${CHESTS[tier].c}">${CHESTS[tier].nm} chest</span></div>
        <button class="btn solid claim" id="claim" ${allDone?'':'disabled'}>${allDone?'Claim rewards':'Finish all four to clear'}</button>

  </div></div>`;
  sc.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{
    const x=q.find(e=>e.id===b.dataset.ex);let v=S.prog.c[x.id]||0;const was=v>=x.t;

      bo.classList.add('hit');FX.float(bx+(Math.random()*60-30),by-50,(crit?'CRIT -':'-')+dmg,crit?'#ffd36b':'#ff8fa3',crit?'big':'');SND.sfx(crit?'crit':'hit');
      FX.burst(bx,by,bc,crit?44:18,crit?6.5:4);if(crit)FX.shake();
      if(p1>=1){setTimeout(()=>{SND.sfx('slay');const w=document.createElement('div');w.className='white-flash';document.body.appendChild(w);setTimeout(()=>w.remove(),600);

  {const bi=sc.querySelector('.hpbar i'),bg=sc.querySelector('.hpbar b');if(bi){requestAnimationFrame(()=>requestAnimationFrame(()=>{bi.style.width=bi.dataset.to+'%';bg.style.width=bi.dataset.to+'%'}));LAST_HP=+bi.dataset.to}}
  wireInstall();tickClock();
}

function effectsHtml(){const c=[];

const FATES=[
 {id:'titan',w:14,good:1,ic:'⚔',nm:'Blessing of the Titan',d:'Mystic strength floods your veins: +5 to every stat and double XP for your next 3 gate clears.'},
 {id:'legend',w:6,good:1,ic:'✦',nm:'Relic of Legend',d:'A legendary item materialises in your bag.'},
 {id:'epic',w:14,good:1,ic:'◆',nm:'Gift of the Deep',d:'An epic item materialises in your bag.'},

 {id:'bleed',w:12,good:0,ic:'☠',nm:'Blood Price',d:'The altar drinks deep. You lose 2 hearts.'},
 {id:'rust',w:8,good:0,ic:'✕',nm:'Curse of Rust',d:'Every piece of armor you wear cracks once.'},
 {id:'heavy',w:6,good:0,ic:'⛓',nm:'Curse of the Heavy Gate',d:'Your next gate demands 50% more reps.'}];
const ALTAR_COST=60,ALTAR_MAX=3;
const altarLeft=()=>ALTAR_MAX-(S.altar&&S.altar.date===today()?S.altar.n:0);
function rollFate(){let x=Math.random()*100;for(const f of FATES){if((x-=f.w)<0)return f}return FATES[0]}
function applyFate(f){let msg=f.d;
  switch(f.id){
    case'titan':S.titan=(S.titan||0)+3;break;
    case'legend':case'epic':{const it=makeItem(SLOTS[Math.floor(Math.random()*SLOTS.length)].id,f.id==='legend'?'legendary':'epic');S.bag.push(it);msg=`${it.nm} (+${it.v} ${it.st}) is now in your bag.`;break}
    case'chest':S.chests.gold++;break;
    case'gold':S.gold+=150;break;
    case'heart':if(S.hearts<3)S.hearts++;else if(S.freezes<3){S.freezes++;msg='You are at full health, so the spring grants a streak freeze.'}else{S.gold+=90;msg='Full health and full freezes: the spring turns to 90 gold.'}break;
    case'bleed':S.hearts=Math.max(0,S.hearts-2);if(S.hearts===0){S.dead=true;msg='The altar drank your last heart. Your hunter has fallen.'}else msg=`You lose 2 hearts. ${S.hearts} left.`;break;
    case'rust':{const rep={shattered:[],cracked:0};crackArmor(rep);msg=rep.cracked||rep.shattered.length?`Your armor cracks.${rep.shattered.length?' Shattered: '+rep.shattered.join(', ')+'.':''}`:'You wear no armor, so the rust finds nothing to eat. Lucky.';break}
    case'heavy':S.heavy=(S.heavy||0)+1;break;
  }
  log(`Altar of Fate: ${f.nm}.`);save();return msg}
function altar(){
  if(S.gold<ALTAR_COST||altarLeft()<=0)return;
  S.gold-=ALTAR_COST;S.altar={date:today(),n:(S.altar&&S.altar.date===today()?S.altar.n:0)+1};save();render();SND.sfx('altar');

      o.innerHTML=`<h3>${f.good?'Blessed':'Cursed'}: ${f.nm}</h3><p>${esc(msg)}</p><div class="row"><button class="btn ${f.good?'solid':'gold'}" id="fateOk">${S.dead?'Face your fate':'Accept fate'}</button></div>`;

  sc.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{BAGF=b.dataset.f;SND.sfx('tick');render()});
  sc.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>equip(b.dataset.eq));
  sc.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const it=item(b.dataset.sell);if(eqd.has(it.id)||it.rar==='epic'||it.rar==='legendary')confirmModal(`Sell ${esc(it.nm)}?`,`You get ${RAR[it.rar].sell} gold. This can't be undone.`,'Sell',()=>sell(it.id));else sell(it.id)});
}
function renderBoard(sc,r){
  const lvOf=x=>{let l=1;while(x>=need(l)){x-=need(l);l++}return l};
  const list=[...BOARDS[BOARD].map(([n,x])=>({n,x})),{n:S.name,x:S.totalXp,me:1}].sort((a,b)=>b.x-a.x);
  const top=list.slice(0,3),ord=[top[1],top[0],top[2]];
  sc.innerHTML=`
  <div class="win sys"><div class="ph"><h3>Leaderboard</h3><span class="note">Sample players · ranked by XP</span></div><div class="pb">
    <div class="seg" role="tablist">${['friends','country','global'].map(b=>`<button class="${BOARD===b?'on':''}" data-b="${b}" role="tab" aria-selected="${BOARD===b}">${b}</button>`).join('')}</div>
    <div class="podium">${ord.map((p,i)=>p?`<div class="pod ${i===1?'first':''}" style="padding-block:${i===1?18:10}px"><div class="p" style="color:${i===1?'var(--gold)':'var(--dim)'}">${i===1?1:i===0?2:3}</div><div class="pn">${esc(p.n)}${p.me?' (you)':''}</div><div class="px">${p.x} XP</div></div>`:'<div></div>').join('')}</div>
    <div class="board">${list.map((b,i)=>{const rr=RANKS[rankIdx(lvOf(b.x))];return`<div class="brow ${b.me?'me':''}"><span class="pos">#${i+1}</span><span class="nm">${esc(b.n)}${b.me?' (you)':''}</span><span class="rk" style="color:${rr.c}">${rr.L}</span><span class="x">${b.x}</span></div>`}).join('')}</div>
  </div></div>
  <div class="win"><div class="ph"><h3>Your climb</h3></div><div class="pb climb">
    ${RANKS.map((x,i)=>`<div class="r ${i===r?'cur':''} ${i>r?'lock':''}"><b style="color:${x.c}">${x.L}</b><span>${x.t}${i===r?' <span class="mono" style="font-size:11px;color:var(--sys)">YOU</span>':''}</span><span class="mono note">Lv ${x.min}+</span></div>`).join('')}
  </div></div>`;
  sc.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{BOARD=b.dataset.b;SND.sfx('tick');render()});
}
function renderShop(sc){
  const arm=SLOTS.filter(s=>s.arm).map(s=>item(S.eq[s.id])).filter(i=>i&&i.dur<3);
  const items=[
    ['freeze','Streak freeze','Covers one missed day. Hold up to 3 (you have '+S.freezes+').',60,S.freezes>=3],
    ['heart','Heart potion','Restore one lost heart.',90,S.hearts>=3],
    ['repair','Repair kit',arm.length?`Restore ${arm.length} cracked armor piece${arm.length>1?'s':''} to full.`:'Your equipped armor is at full durability.',40,!arm.length],
    ['chest','Iron chest','Better odds than wooden.',120,false]];
  sc.innerHTML=`
  <div class="win sys"><div class="ph"><h3>Shop</h3><span class="mono" style="color:var(--gold)">${S.gold} G</span></div><div class="pb shop">
    ${items.map(([id,nm,d,p,blocked])=>`<div class="item"><div><div style="font-weight:600">${nm}</div><div class="d">${d}</div></div><button class="btn gold" data-buy="${id}" ${S.gold<p||blocked?'disabled':''}>${p} G</button></div>`).join('')}
    <p class="note">Earn gold by clearing gates and selling gear from your bag.</p>
  </div></div>
  <div class="win"><div class="ph"><h3>System log</h3></div><div class="pb">
    <div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div>
    <div style="margin-top:16px"><div class="eyebrow" style="color:var(--dim);margin-bottom:8px">Test controls</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="skipDay">Jump to tomorrow</button><button class="btn ghost sm" id="about">How to play</button><button class="btn ghost sm" id="reset">Reset hunter</button></div>
    <p class="note" style="margin-top:6px">"Jump to tomorrow" moves the game clock ahead one day so you can see streaks, lost hearts and cracked armor in action.</p></div>
  </div></div>`;
  const buy={freeze:()=>{S.freezes++;return'Streak freeze added.'},heart:()=>{S.hearts++;return'+1 heart.'},
    repair:()=>{arm.forEach(i=>i.dur=3);return'Armor repaired.'},chest:()=>{S.chests.iron++;return'Iron chest added to Loot.'}};
  sc.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const it=items.find(x=>x[0]===b.dataset.buy);S.gold-=it[3];const m=buy[it[0]]();log(`Bought: ${it[1]}.`);save();SND.sfx('coin');render();toast(m)});
  $('#skipDay').onclick=()=>{S.offset++;const rep=evaluate();render();if(!rep.missed&&!rep.frozen&&!rep.fell){SND.sfx('notice');toast(`Game clock: ${fmtDate(today())}`)}else reportModal(rep)};
  $('#about').onclick=howTo;
  $('#reset').onclick=()=>confirmModal('Reset your hunter?','Everything will be wiped and you will start from the selection screen.','Reset',()=>{try{localStorage.removeItem(KEY)}catch(e){}S=null;showLanding();selectionModal()});
}
function tickClock(){const el=$('#clock');if(!el)return;const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);let s=Math.max(0,Math.floor((m-n)/1000));
  el.textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}
setInterval(tickClock,1000);

function showApp(){$('#landing').hidden=true;$('#app').hidden=false;const rep=evaluate();render();window.scrollTo(0,0);reportModal(rep)}
function showLanding(){$('#app').hidden=true;$('#landing').hidden=false;window.scrollTo(0,0);paintSound();const e=$('#enterBtn');if(e)e.textContent=S?'Continue':'Enter the gate'}
function howTo(){openModal(`<div class="tag">HOW TO PLAY</div><h2>One gate a day</h2><div class="guide">
 <div><b>1 · Slay the gate boss</b><span>Every rep you log strikes today's boss. Finish push-ups, sit-ups, squats and your run before midnight to slay it, then claim XP and gold.</span></div>
 <div><b>2 · Open chests</b><span>Every clear drops a chest. 3, 7 and 14-day streaks drop Iron, Gilded and Obsidian chests.</span></div>
 <div><b>3 · Gear up</b><span>Equip six slots (weapon, head, body, hands, feet, relic) to raise STR, AGI, VIT and END. Sell spares for gold.</span></div>
 <div><b>4 · Rank up</b><span>Levels lift you from E-Rank Initiate to S-Rank Sovereign. Higher ranks mean harder quests.</span></div>
 <div style="border-color:var(--arcane)"><b style="color:#cbbcff">Altar of Fate</b><span>In the Loot tab, offer gold to turn a fate card. Win loot, gold or the Titan's Blessing, or risk curses that cost hearts.</span></div>
 <div style="border-color:var(--blood)"><b style="color:var(--blood)">Miss a day</b><span>Lose a heart, your streak resets and your armor cracks. Lose all 3 hearts and you fall.</span></div>
 </div><div class="row"><button class="btn solid" id="hOk">Got it</button></div>`);$('#hOk').onclick=closeModal}

{const p=document.querySelector('.portal svg');if(p)document.querySelector('.bgrune').innerHTML=p.outerHTML.replace(/id="(rp1|rp2|pglow)"/g,'id="bg-$1"').replace(/#(rp1|rp2|pglow)/g,'#bg-$1')}
$('#rankrow').innerHTML=RANKS.map(r=>`<span style="--c:${r.c}">${r.L}</span>`).join('');
document.querySelectorAll('[data-howto]').forEach(b=>b.onclick=()=>{SND.sfx('tab');howTo()});
document.querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>{if(SND.pref()){SND.start();paintSound()}S?showApp():selectionModal()});
document.querySelectorAll('#landing [data-sound]').forEach(b=>b.onclick=toggleSound);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden&&!$('#tapOpen')&&!$('#nf'))closeModal()});

S=load();paintSound();showLanding();
if(!S)selectionModal();
</script>

</body>
</html>
